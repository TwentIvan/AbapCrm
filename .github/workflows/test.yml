name: Test (The Hub Up)

# Test su ogni PR e sui branch delle squadre Botcave: senza questo job le PR della squadra risultano «nessuna CI»
on:
  pull_request:
  push:
    branches: ["botcave/**", "feat/**"]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
